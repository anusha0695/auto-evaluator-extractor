[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
explicit_package_bases = True
exclude = (?x)(
      ^\.venv/
    | ^snapshots/
    | ^data/
    | ^ground_truth/
    )

# Vertex AI / DocAI / scispacy / google-genai don't ship complete stubs.
# ignore_missing_imports above covers these globally.

[mypy-tests.*]
disallow_untyped_defs = False

[mypy-scripts.*]
disallow_untyped_defs = False
