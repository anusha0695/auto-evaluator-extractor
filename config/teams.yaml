# =============================================================================
# extractor — Specialist Team registry
#
# Each team owns exactly one umbrella section of config/schemas/genomic_pathology_v2.json.
# The same Extractor / Coverage Auditor / Arbiter agent classes are instantiated
# per team with the team-specific prompt template and schema section.
# =============================================================================

# Path to the schema used for Pydantic generation + Gemini structured-output spec.
# Single source of truth — when this file changes, no Python code needs to change.
schema_path: config/schemas/genomic_pathology_v2.json

teams:

  metadata_team:
    # ----- Schema binding -----
    # The team output is validated against this section's Pydantic model
    # (generated at runtime by core/schema_loader.py from the JSON Schema).
    schema_section: report_metadata

    # ----- Prompt templates -----
    # The team-specific template; the renderer also pulls the base system
    # prompts from config/prompts/system/ for each agent role.
    prompt_template: config/prompts/metadata_team.j2

    # ----- Model assignments (temperature locked at 0.0 per policy) -----
    models:
      extractor:        { name: gemini-2.5-pro,   temperature: 0.0 }
      coverage_auditor: { name: gemini-2.5-pro,   temperature: 0.0 }
      arbiter:          { name: gemini-2.5-flash, temperature: 0.0 }

    # ----- Tool allowlist (subset of config/tools.yaml) -----
    tool_allowlist:
      - pdf_page_loader
      - pdf_text_search
      - docai_layout_lookup
      - npi_validator
      - date_parser
      - schema_validate
      - state_read

    # ----- Routing thresholds -----
    # If schema validation passes and the team's llm_confidence_score exceeds
    # this, the decision router emits auto_accept; otherwise sme_flag.
    auto_accept_confidence_threshold: 0.85

    # ----- Coverage Auditor signal -----
    # Mismatch between extracted-field count and parser_hypothesis count beyond
    # this threshold raises a gap_signal that invokes the Arbiter.
    coverage_gap_tolerance: 0.10

  # ===========================================================================
  # Phase 2a teams. These bind to schema v3 sections, so graph_linear loads
  # config/schemas/genomic_pathology_v3.json (the top-level `schema_path` above
  # stays v2 for the frozen graph_v1 / MetadataTeam). Built via
  # teams.section_team.build_section_team — same 3-agent skeleton.
  # ===========================================================================

  # molecular_biomarker_team owns the SINGLE biomarker umbrella (v3 merge —
  # production folds variants into biomarkers). It captures protein-expression
  # markers, aggregate scores, AND gene sequence variants (populating the nested
  # variant_detail with verbatim + hgvs-normalized HGVS). The former
  # genomic_variant_team is retired; its HGVS tools moved here.
  molecular_biomarker_team:
    schema_section: other_molecular_biomarker_umbrella
    prompt_template: config/prompts/molecular_biomarker_team.j2
    models:
      extractor:        { name: gemini-2.5-pro,   temperature: 0.0 }
      coverage_auditor: { name: gemini-2.5-pro,   temperature: 0.0 }
      arbiter:          { name: gemini-2.5-flash, temperature: 0.0 }
    tool_allowlist:
      - pdf_page_loader
      - pdf_text_search
      - docai_layout_lookup
      - state_read
      - schema_validate
      - biomarker_normalize
      - method_normalize
      - hgnc_normalize
      - hgvs_validate
      - normalize_quantity
    auto_accept_confidence_threshold: 0.85
    coverage_gap_tolerance: 0.10

  tested_biomarker_team:
    schema_section: tested_biomarker_umbrella
    prompt_template: config/prompts/tested_biomarker_team.j2
    models:
      extractor:        { name: gemini-2.5-pro,   temperature: 0.0 }
      coverage_auditor: { name: gemini-2.5-pro,   temperature: 0.0 }
      arbiter:          { name: gemini-2.5-flash, temperature: 0.0 }
    tool_allowlist:
      - pdf_page_loader
      - pdf_text_search
      - docai_layout_lookup
      - state_read
      - schema_validate
      - hgnc_normalize
    auto_accept_confidence_threshold: 0.85
    coverage_gap_tolerance: 0.10

  clinical_info_team:
    schema_section: clinical_information
    prompt_template: config/prompts/clinical_info_team.j2
    models:
      extractor:        { name: gemini-2.5-pro,   temperature: 0.0 }
      coverage_auditor: { name: gemini-2.5-pro,   temperature: 0.0 }
      arbiter:          { name: gemini-2.5-flash, temperature: 0.0 }
    tool_allowlist:
      - pdf_page_loader
      - pdf_text_search
      - docai_layout_lookup
      - state_read
      - schema_validate
      - date_parser
    auto_accept_confidence_threshold: 0.85
    coverage_gap_tolerance: 0.10

  # ===========================================================================
  # Phase 2b — multi-specimen surgical-pathology narrative. Same generic
  # SectionTeam; the Planner activates it only when a significant-findings
  # signal is present (skipped on molecular-only reports like the JAK2 demo).
  # ===========================================================================

  specimen_findings_team:
    schema_section: significant_findings
    prompt_template: config/prompts/specimen_findings_team.j2
    models:
      extractor:        { name: gemini-2.5-pro,   temperature: 0.0 }
      coverage_auditor: { name: gemini-2.5-pro,   temperature: 0.0 }
      arbiter:          { name: gemini-2.5-flash, temperature: 0.0 }
    tool_allowlist:
      - pdf_page_loader
      - pdf_text_search
      - docai_layout_lookup
      - state_read
      - schema_validate
    auto_accept_confidence_threshold: 0.85
    coverage_gap_tolerance: 0.10
